server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 10M;

    # Baseline security headers (CSP tightened in P8-S6)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Docker embedded DNS so container restarts do not break upstream resolution
    resolver 127.0.0.11 valid=30s;

    # Laravel API, Sanctum CSRF cookie, and framework health route
    location ~ ^/(api|sanctum|up)(/|$) {
        set $php_upstream app:9000;
        fastcgi_pass $php_upstream;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 8 32k;
        fastcgi_hide_header X-Powered-By;
    }

    # Publicly linked storage files (product images, brand logos)
    location /storage/ {
        try_files $uri =404;
    }

    # Block dotfiles except .well-known and Vite's dev pre-bundled .vite cache
    location ~ ^(?!/node_modules/\.vite/).*/\.(?!well-known).* {
        deny all;
    }

    # React SPA via Vite dev server (supports HMR WebSockets)
    location / {
        set $vite_upstream http://web:5173;
        proxy_pass $vite_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 8080;
        proxy_read_timeout 86400;
    }
}
