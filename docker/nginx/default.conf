server {
    listen 80;
    server_name localhost;

    server_tokens off;
    client_max_body_size 10M;

    # Default security headers (inherited by locations without their own add_header)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

    # Docker embedded DNS so container restarts do not break upstream resolution
    resolver 127.0.0.11 valid=30s;

    # FastAPI API, Sanctum CSRF cookie, and framework health route
    location ~ ^/(api|sanctum|up)(/|$) {
        set $fastapi_upstream http://app:8000;
        proxy_pass $fastapi_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Public storage files (images and static assets)
    location /storage/ {
        alias /app/storage/public/;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    }

    # Block dotfiles except .well-known and Vite's dev pre-bundled .vite cache
    location ~ ^(?!/node_modules/\.vite/).*/\.(?!well-known).* {
        deny all;
    }

    # React SPA via Vite dev server (supports HMR WebSockets).
    # Note: script-src 'unsafe-inline' and connect-src ws:/wss: are required solely for Vite dev HMR
    # (@vitejs/plugin-react injects an inline refresh preamble). Production builds (P9-S3) serve static
    # bundles with /theme-init.js as an external script and tighten this to:
    #   script-src 'self'; connect-src 'self';
    location / {
        set $vite_upstream http://web:5173;
        proxy_pass $vite_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 8080;
        proxy_read_timeout 86400;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
    }
}
