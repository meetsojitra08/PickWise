name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Ruff, MyPy, Pytest)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pickwise
          POSTGRES_USER: pickwise
          POSTGRES_PASSWORD: pickwise
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U pickwise -d pickwise"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio ruff mypy httpx

      - name: Check code formatting & lint (Ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Seed test database
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: pickwise
          DB_USERNAME: pickwise
          DB_PASSWORD: pickwise
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          APP_ENV: local
        run: python -m app.db.seed

      - name: Run test suite (pytest)
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: pickwise
          DB_USERNAME: pickwise
          DB_PASSWORD: pickwise
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          APP_ENV: local
        run: pytest tests/

  frontend:
    name: Frontend (Lint, Format, Typecheck, Vitest, Build, Audit)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Lint code (ESLint)
        run: npm run lint

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run tests (Vitest)
        run: npm run test

      - name: Build production bundle
        run: npm run build

      - name: Audit npm dependencies
        run: npm audit --omit=dev --audit-level=moderate
