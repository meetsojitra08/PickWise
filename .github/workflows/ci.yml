name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Pint, Larastan, Pest, Audit)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pickwise
          POSTGRES_USER: pickwise
          POSTGRES_PASSWORD: pickwise
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U pickwise -d pickwise"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_pgsql, pgsql, bcmath, zip, redis
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Check code style (Pint)
        run: ./vendor/bin/pint --test

      - name: Run static analysis (Larastan)
        run: ./vendor/bin/phpstan analyse --no-progress

      - name: Run test suite (Pest)
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: pickwise
          DB_USERNAME: pickwise
          DB_PASSWORD: pickwise
          REDIS_CLIENT: phpredis
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
        run: ./vendor/bin/pest

      - name: Audit Composer dependencies
        run: composer audit --no-interaction

  frontend:
    name: Frontend (Lint, Format, Typecheck, Vitest, Build, Audit)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Lint code (ESLint)
        run: npm run lint

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run tests (Vitest)
        run: npm run test

      - name: Build production bundle
        run: npm run build

      - name: Audit npm dependencies
        # Enforce high/critical severity gate; transitive low/moderate advisories come from CLI/dev tooling (eslint, shadcn).
        run: npm audit --audit-level=high
